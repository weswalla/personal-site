<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello — Experiment</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      .box {
        text-align: center;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 0.5rem;
        background: #38bdf8;
        color: #0f172a;
        cursor: pointer;
      }
      p {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Hello, experiment 👋</h1>
      <p>This standalone HTML file is served as-is from <code>public/</code>.</p>
      <p>Count: <span id="count">0</span></p>
      <button id="btn">Click me</button>
    </div>
    <script>
      let n = 0;
      const out = document.getElementById('count');
      document.getElementById('btn').addEventListener('click', () => {
        out.textContent = ++n;
      });
    </script>
  </body>
</html>
